<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuj | JEE</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#020617;
color:white;
text-align:center;
}

nav{
position:fixed;
width:100%;
padding:15px;
background:#020617cc;
top:0;
}

nav a{
color:white;
margin:10px;
text-decoration:none;
}

section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.glass{
background:#020617;
border:1px solid #1e293b;
border-radius:12px;
padding:20px;
margin-top:20px;
box-shadow:0 0 15px #38bdf8;
width:90%;
max-width:500px;
}

.btn{
padding:10px 20px;
margin:5px;
border:none;
background:#38bdf8;
cursor:pointer;
border-radius:6px;
}

#statusBox{
position:fixed;
right:20px;
top:80px;
display:flex;
align-items:center;
gap:8px;
}

#statusDot{
width:10px;
height:10px;
border-radius:50%;
background:red;
}

.studying{
background:#22c55e !important;
box-shadow:0 0 10px #22c55e;
}
</style>
</head>

<body>

<nav>
<a href="#home">Home</a>
<a href="#daily">Daily Target</a>
</nav>

<div id="statusBox">
<span id="statusDot"></span>
<span id="statusText">Not Studying</span>
</div>

<section id="home">
<h1>Hi, I'm Anuj 👋</h1>

<div class="glass">
Bhai JEE ne lanka laga diya hai 😭
</div>
</section>

<section id="daily">

<h2>Study Timer</h2>

<div class="glass">
<h1 id="timerDisplay">00:00:00</h1>

<button class="btn" onclick="startTimer()">Start</button>
<button class="btn" onclick="stopTimer()">Stop</button>
<button class="btn" onclick="resetTimer()">Reset</button>
</div>

</section>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwfyW14gXtjvRHP4J2kQfLZ7WlMxABHEVEkjPL9whxmYZISUmmmdYHM2Ckj0VSGkZ_7/exec";

let timerInterval;
let startTime = null;

// FORMAT
function formatTime(ms){
let s = Math.floor(ms/1000);
let h = String(Math.floor(s/3600)).padStart(2,'0');
let m = String(Math.floor((s%3600)/60)).padStart(2,'0');
let sec = String(s%60).padStart(2,'0');
return `${h}:${m}:${sec}`;
}

// STATUS
function updateStatus(){
const dot = document.getElementById("statusDot");
const text = document.getElementById("statusText");

if(startTime){
dot.classList.add("studying");
text.innerText="Studying";
}else{
dot.classList.remove("studying");
text.innerText="Not Studying";
}
}

// TIMER RUN
function runTimer(){
clearInterval(timerInterval);

timerInterval = setInterval(()=>{
if(!startTime) return;

let diff = new Date() - startTime;
document.getElementById("timerDisplay").innerText = formatTime(diff);

updateStatus();

},1000);
}

// START
function startTimer(){
if(startTime) return;

startTime = new Date();
localStorage.setItem("startTime", startTime);

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
date:startTime.toISOString().split("T")[0],
start:startTime.toTimeString().split(" ")[0]
})
});

runTimer();
updateStatus();
}

// STOP
function stopTimer(){
clearInterval(timerInterval);

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
date:new Date().toISOString().split("T")[0],
end:new Date().toTimeString().split(" ")[0]
})
});

startTime=null;
localStorage.removeItem("startTime");

document.getElementById("timerDisplay").innerText="00:00:00";
updateStatus();
}

// RESET
function resetTimer(){
clearInterval(timerInterval);
startTime=null;
localStorage.removeItem("startTime");
document.getElementById("timerDisplay").innerText="00:00:00";
updateStatus();
}

// LOAD FROM SERVER (IMPORTANT)
function syncTimer(){

fetch(API_URL)
.then(res=>res.json())
.then(data=>{

const running = data.reverse().find(r=>r.start && !r.end);

if(running){
const start = new Date(running.date+"T"+running.start);

if(!startTime){
startTime = start;
runTimer();
}
}else{
startTime=null;
updateStatus();
}

}).catch(()=>{});
}

// ON LOAD
window.onload=()=>{
const saved = localStorage.getItem("startTime");

if(saved){
startTime = new Date(saved);
runTimer();
}

syncTimer();
setInterval(syncTimer,5000);
}

</script>

</body>
</html>
