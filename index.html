<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuj | JEE</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#020617;
color:white;
text-align:center;
}

#loader{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.hide-loader{display:none;}

.glass{
background:rgba(2,6,23,0.6);
border-radius:14px;
padding:20px;
margin:20px;
box-shadow:0 0 20px #0ea5e9;
}

.btn{
padding:10px 20px;
border-radius:8px;
border:none;
background:#38bdf8;
cursor:pointer;
margin:5px;
}

#statusBox{
position:fixed;
right:20px;
top:100px;
display:flex;
gap:8px;
align-items:center;
}

#statusDot{
width:12px;
height:12px;
border-radius:50%;
background:red;
box-shadow:0 0 10px red;
}

.studying{
background:#22c55e !important;
box-shadow:0 0 12px #22c55e;
}
</style>
</head>

<body>

<div id="loader">Loading...</div>

<h1>Hi, I'm Anuj 👋</h1>

<div id="statusBox">
<span id="statusDot"></span>
<span id="statusText">Not Studying</span>
</div>

<div class="glass">
<h2>Study Timer ⏱️</h2>
<h1 id="timerDisplay">00:00:00</h1>

<button onclick="startTimer()" class="btn">Start</button>
<button onclick="stopTimer()" class="btn">Stop</button>
<button onclick="resetTimer()" class="btn">Reset</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwfyW14gXtjvRHP4J2kQfLZ7WlMxABHEVEkjPL9whxmYZISUmmmdYHM2Ckj0VSGkZ_7/exec";

let timerInterval = null;
let startTimeGlobal = null;
let isManuallyStopped = false;

// LOAD
window.addEventListener("load", () => {
document.getElementById("loader").classList.add("hide-loader");

loadTimerFromServer();
setInterval(loadTimerFromServer, 5000);

const saved = localStorage.getItem("startTime");
if(saved){
startTimeGlobal = new Date(saved);
runTimer();
}
});

// START
function startTimer(){
if(startTimeGlobal) return;

isManuallyStopped = false;

const now = new Date();
localStorage.setItem("startTime", now.toISOString());
startTimeGlobal = now;

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
date: now.toISOString().split("T")[0],
start: now.toTimeString().split(" ")[0]
})
});

runTimer();
updateStatus();
}

// STOP
function stopTimer(){
isManuallyStopped = true;

clearInterval(timerInterval);
startTimeGlobal = null;
localStorage.removeItem("startTime");

updateStatus();

const now = new Date();

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
date: now.toISOString().split("T")[0],
end: now.toTimeString().split(" ")[0]
})
});

setTimeout(()=>{isManuallyStopped=false},5000);
}

// RESET
function resetTimer(){
clearInterval(timerInterval);
startTimeGlobal=null;
localStorage.removeItem("startTime");
document.getElementById("timerDisplay").innerText="00:00:00";
updateStatus();
}

// TIMER LOOP
function runTimer(){
clearInterval(timerInterval);

timerInterval = setInterval(()=>{
if(!startTimeGlobal) return;

const now = new Date();
const diff = now - startTimeGlobal;

document.getElementById("timerDisplay").innerText = formatTime(diff);
updateStatus();
},1000);
}

// FORMAT
function formatTime(ms){
let s=Math.floor(ms/1000);
let h=String(Math.floor(s/3600)).padStart(2,'0');
let m=String(Math.floor((s%3600)/60)).padStart(2,'0');
let sec=String(s%60).padStart(2,'0');
return h+":"+m+":"+sec;
}

// STATUS
function updateStatus(){
const dot=document.getElementById("statusDot");
const text=document.getElementById("statusText");

if(startTimeGlobal){
dot.classList.add("studying");
text.innerText="Studying";
}else{
dot.classList.remove("studying");
text.innerText="Not Studying";
}
}

// SERVER SYNC
function loadTimerFromServer(){
if(isManuallyStopped) return;

fetch(API_URL)
.then(res=>res.json())
.then(data=>{
if(!data || data.length===0) return;

const running = data.reverse().find(row =>
(row.start || row.StartTime) && (!row.end && !row.EndTime)
);

if(running){
const start = new Date(
(running.date || running.Date)+"T"+
(running.start || running.StartTime)
);

if(!startTimeGlobal || Math.abs(startTimeGlobal-start)>2000){
startTimeGlobal=start;
runTimer();
}

updateStatus();
}
});
}
</script>

</body>
</html>
