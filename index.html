<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuj | Dev Portfolio</title>

<style>
 .icon-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
   .floating-social {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.float-btn {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #0088cc;
  overflow: hidden;
}

.float-btn i {
  font-size: 22px;
  color: white;
}

/* X button */
.float-btn.x {
  background: black;
}
body{
margin:0;
font-family:Arial,sans-serif;
background:#020617;
color:white;
overflow-x:hidden;
scroll-behavior:smooth;
}

/* ===== LOADING SCREEN ===== */
#loader{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
transition:opacity .8s ease, visibility .8s;
}

.loader-ring{
width:70px;
height:70px;
border-radius:50%;
border:4px solid #1e293b;
border-top:4px solid #38bdf8;
animation:spin 1s linear infinite;
margin-bottom:20px;
}
@keyframes spin{
to{transform:rotate(360deg);}
}

.hide-loader{
opacity:0;
visibility:hidden;
}

/* ===== Neon Background ===== */
.neon{
position:fixed;
width:200px;
height:200px;
background:radial-gradient(circle,#38bdf8,transparent);
filter:blur(80px);
opacity:.25;
animation:float 12s infinite alternate;
z-index:-1;
}
.neon:nth-child(1){top:10%;left:10%;}
.neon:nth-child(2){bottom:10%;right:10%;animation-delay:3s;}
@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* ===== Navbar ===== */
nav{
position:fixed;
width:100%;
padding:15px;
background:#020617cc;
backdrop-filter:blur(8px);
text-align:center;
z-index:100;
}
nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}
nav a:hover{color:#38bdf8;}

section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:40px;
}

/* ===== Gradient Name ===== */
.gradient{
font-size:55px;
background:linear-gradient(90deg,#38bdf8,#a78bfa,#38bdf8);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:shine 4s linear infinite;
}
@keyframes shine{
0%{background-position:0%;}
100%{background-position:200%;}
}

#typing{font-size:22px;margin-top:10px;opacity:.85;}

/* Chill panel */
.glass{
background:rgba(2,6,23,0.6);
border:1px solid #1e293b;
backdrop-filter:blur(12px);
border-radius:14px;
padding:20px;
margin-top:20px;
box-shadow:0 0 20px #0ea5e9;
}

/* Cards */
.card{
background:#020617;
padding:20px;
margin:15px;
border-radius:14px;
border:1px solid #1e293b;
transition:.4s;
}

.card:hover{
transform:scale(1.06);
box-shadow:0 0 25px #38bdf8;
}

/* Button */
.btn{
margin-top:15px;
padding:10px 20px;
border-radius:8px;
border:1px solid #38bdf8;
color:white;
text-decoration:none;
transition:.3s;
}
.btn:hover{
background:#38bdf8;
box-shadow:0 0 15px #38bdf8;
}

/* Floating Social */
.floating-social{
position:fixed;
right:20px;
bottom:20px;
display:flex;
flex-direction:column;
gap:12px;
}
.float-btn{
width:50px;height:50px;
border-radius:50%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
border:1px solid #38bdf8;
transition:.3s;
}
.float-btn svg{fill:white;width:24px;}
.float-btn:hover{
background:#38bdf8;
transform:scale(1.15);
box-shadow:0 0 20px #38bdf8;
}

/* Mouse Glow */
#cursorGlow{
position:fixed;
width:150px;height:150px;
border-radius:50%;
background:radial-gradient(circle,#38bdf8,transparent);
pointer-events:none;
opacity:.25;
transform:translate(-50%,-50%);
}

 #upcoming {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 20px;
  scroll-behavior: smooth;
}

.date-card {
  min-width: 220px;
  max-width: 220px;
  background: #020617;
  border: 2px solid #1e293b;
  border-radius: 20px;
  padding: 15px;
  flex-shrink: 0;
}

.date-card h3 {
  margin-bottom: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="loader-ring"></div>
<div>Loading...</div>
</div>

<div class="neon"></div>
<div class="neon"></div>
<div id="cursorGlow"></div>

<nav>
<a href="#home">Home</a>
<a href="#skills">Skills</a>
<a href="#daily-target">Daily Target</a>
</nav>

<section id="home">
<h1 class="gradient">Hi, I'm Anuj 👋</h1>
<h2 id="typing"></h2>

<div class="glass">
Bhai JEE ne lanka laga diya hai 🙂‍↕️🙂‍↕️
</div>
 </section>

<!-- ✅ ADD THIS HERE -->
<section id="daily-target">
<h2>Today Target 🎯</h2>

<div id="todayList"></div>

<div class="glass">
<p id="progressText"></p>
</div>

<h2>Upcoming Targets ⏳</h2>
<div id="upcoming"></div>

<h2>Previous Targets 📅</h2>
<div id="history"></div>

</section>


<section id="skills">
</section>

 
<!-- Floating Icons -->
<div class="floating-social">

<a class="float-btn" href="https://t.me/hackergone" target="_blank">
  <img src="telegram.png" class="icon-img">
</a>

<a class="float-btn" href="https://twitter.com/YOUR_USERNAME" target="_blank">
   <i class="fab fa-x-twitter"></i>
</a>

</div>


<script>
 // FIX LOADER
window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").classList.add("hide-loader");
  },1000);
});

fetch("https://opensheet.elk.sh/1A1In9joYUNj8kTljvEZ7DyZcGt7RsBsiMUcPi_LEbLA/Sheet1")
  .then(res => res.json())
  .then(data => {

    const todayDiv = document.getElementById("todayList");
    const upcomingDiv = document.getElementById("upcoming");

    todayDiv.innerHTML = "";
    upcomingDiv.innerHTML = "";

    const todayDate = new Date().toISOString().split("T")[0];

    const grouped = {};

    data.forEach(row => {
      const targets = [row.T1, row.T2, row.T3, row.T4, row.T5, row.T6, row.T7];

      targets.forEach(target => {
        if (!target) return;

        if (row.Date === todayDate) {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `<input type="checkbox"> ${target}`;
          todayDiv.appendChild(div);

        } else if (row.Date > todayDate) {

          if (!grouped[row.Date]) {
            grouped[row.Date] = [];
          }

          grouped[row.Date].push(target);
        }
      });
    });

    Object.keys(grouped).forEach(date => {

      const card = document.createElement("div");
      card.className = "date-card";

      const formattedDate = new Date(date).toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short"
      });

      let targetsHTML = "";
      grouped[date].forEach(t => {
        targetsHTML += `<div><input type="checkbox"> ${t}</div>`;
      });

      card.innerHTML = `
        <h3>${formattedDate}</h3>
        ${targetsHTML}
      `;

      upcomingDiv.appendChild(card);
    });

  });
</script>
</body>
</html>
