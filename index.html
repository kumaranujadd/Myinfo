<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuj | JEE</title>

  <style>
    .icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .floating-social {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }

    .float-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #0088cc;
      overflow: hidden;
      border: 1px solid #38bdf8;
    }

    .float-btn i {
      font-size: 22px;
      color: white;
    }

    .float-btn.x {
      background: black;
    }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", "Segoe UI Emoji",
               "Segoe UI Symbol", "Noto Color Emoji",
               "Apple Color Emoji", sans-serif;

  background: #020617;   /* 🔥 bring back dark theme */
  color: white;
  overflow-x: hidden;
  scroll-behavior: smooth;
}
    
    #loader {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity .5s ease, visibility .5s ease;
    }

    .loader-ring {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 4px solid #1e293b;
      border-top: 4px solid #38bdf8;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hide-loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .neon {
      position: fixed;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #38bdf8, transparent);
      filter: blur(80px);
      opacity: .25;
      animation: float 12s infinite alternate;
      z-index: -1;
    }

    .neon:nth-child(1) { top: 10%; left: 10%; }
    .neon:nth-child(2) { bottom: 10%; right: 10%; animation-delay: 3s; }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(60px); }
    }

    nav {
      position: fixed;
      width: 100%;
      padding: 15px;
      background: #020617cc;
      backdrop-filter: blur(8px);
      text-align: center;
      z-index: 100;
    }

    nav a {
      color: white;
      margin: 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover { color: #38bdf8; }

    section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

    .gradient {
      font-size: 55px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #38bdf8);
      background-size: 200%;
      -webkit-background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      0% { background-position: 0%; }
      100% { background-position: 200%; }
    }

    #typing {
      font-size: 22px;
      margin-top: 10px;
      opacity: .85;
    }

    .glass {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid #1e293b;
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px #0ea5e9;
      width: min(900px, 100%);
      box-sizing: border-box;
    }

    .card {
      background: #020617;
      padding: 20px;
      margin: 15px;
      border-radius: 14px;
      border: 1px solid #1e293b;
      transition: .4s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px #38bdf8;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      color: #020617;
      background: #38bdf8;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
    }

    .btn:hover {
      background: #0ea5e9;
      color: white;
      box-shadow: 0 0 15px #38bdf8;
    }

    
    #upcoming,
    #history {
      display: flex;
      overflow-x: auto;
      gap: 20px;
      padding: 20px;
      scroll-behavior: smooth;
      width: 100%;
      box-sizing: border-box;
    }

    #upcoming::-webkit-scrollbar,
    #history::-webkit-scrollbar {
      display: none;
    }

    .date-card {
      min-width: 220px;
      max-width: 220px;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 20px;
      padding: 15px;
      flex-shrink: 0;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    .date-card h3 {
      margin-bottom: 10px;
      text-align: center;
    }

    .scroll-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .scroll-btn {
      position: absolute;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #020617;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid #38bdf8;
      transition: 0.3s;
    }

    .scroll-btn:hover {
      background: #38bdf8;
      transform: scale(1.1);
      box-shadow: 0 0 15px #38bdf8;
    }

    .scroll-btn.left { left: 5px; }
    .scroll-btn.right { right: 5px; }

    #statusBox {
      position: fixed;
      right: 20px;
      top: 120px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 16px;
      z-index: 200;
    }

    #statusDot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: red;
      box-shadow: 0 0 10px red;
    }

    .studying {
      background: #22c55e !important;
      box-shadow: 0 0 12px #22c55e !important;
    }

    #timerDisplay {
      font-size: 2.5rem;
      margin: 10px 0 0;
    }

    @media (max-width: 700px) {
      .gradient { font-size: 40px; }
      section { padding: 22px; }
      .glass { width: 100%; }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="loader-ring"></div>
    <div>Loading...</div>
  </div>

  <div class="neon"></div>
  <div class="neon"></div>

  <nav>
    <a href="#home">Home</a>
    <a href="#daily-target">Daily Target</a>
  </nav>

  <section id="home">
    <h1 class="gradient">Hi, I'm Anuj 👋</h1>
    <h2 id="typing"></h2>
    <h2 id="todayTime" style="
  margin-top:20px;
  font-size:28px;
  color:#38bdf8;
  text-shadow: 0 0 10px #38bdf8;
">
  Today: 00:00:00
</h2>
  </section>

  <section id="daily-target">
    <h2>Today Target 🎯</h2>
    <div id="todayList"></div>

    <div class="glass">
      <p id="progressText"></p>
    </div>

    <h2>Upcoming Targets ⏳</h2>
    <div class="scroll-wrapper">
      <button class="scroll-btn left" onclick="scrollLeftFunc('upcoming')">◀</button>
      <div id="upcoming"></div>
      <button class="scroll-btn right" onclick="scrollRightFunc('upcoming')">▶</button>
    </div>

    <h2>Previous Targets 📅</h2>
    <div class="scroll-wrapper">
      <button class="scroll-btn left" onclick="scrollLeftFunc('history')">◀</button>
      <div id="history"></div>
      <button class="scroll-btn right" onclick="scrollRightFunc('history')">▶</button>
    </div>
  </section>


  <div class="floating-social">
    <a class="float-btn" href="https://t.me/hackergone" target="_blank">
      <img src="telegram.png" class="icon-img" alt="Telegram">
    </a>

    <a class="float-btn x" href="https://twitter.com/YOUR_USERNAME" target="_blank" aria-label="X">
      <i class="fab fa-x-twitter"></i>
    </a>
  </div>

  <div id="statusBox">
    <span id="statusDot"></span>
    <span id="statusText">Not Studying</span>
  </div>

  <div class="glass">
    <h2>Study Timer ⏱️</h2>
    <h1 id="timerDisplay">00:00:00</h1>
    <button onclick="startTimer()" class="btn">▶ Start</button>
    <button onclick="stopTimer()" class="btn">⏹ Stop</button>
    <button onclick="resetTimer()" class="btn">🔄 Reset</button>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  
  <script>

    const firebaseConfig = {
  apiKey: "AIzaSyBQ1QHjhz7gYbWOlzoe0He1eJFhLwkg20",
  authDomain: "my-web-2b9b6.firebaseapp.com",
  projectId: "my-web-2b9b6",
  storageBucket: "my-web-2b9b6.firebasestorage.app",
  messagingSenderId: "213483527926",
  appId: "1:213483527926:web:74e8443a889c6f683516d7",

  databaseURL: "https://my-web-2b9b6-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
    
    const TARGETS_URL = "https://opensheet.elk.sh/1A1In9joYUNj8kTljvEZ7DyZcGt7RsBsiMUcPi_LEbLA/Sheet1";

    
    let timerInterval = null;
  
    function hideLoaderSoon() {
      const loader = document.getElementById("loader");
      if (!loader) return;
      setTimeout(() => loader.classList.add("hide-loader"), 1000);
    }

    function parseSheetDate(value) {
      if (!value) return null;

      if (typeof value === "string" && value.includes("/")) {
        const parts = value.split("/");
        if (parts.length === 3) {
          const d = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
          return isNaN(d.getTime()) ? null : d;
        }
      }

      const d = new Date(value);
      return isNaN(d.getTime()) ? null : d;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener("load", () => {
      hideLoaderSoon();
      fetchTargets();
    });

    function fetchTargets() {
      fetch(TARGETS_URL)
        .then(res => {
          if (!res.ok) throw new Error("Target fetch failed");
          return res.json();
        })
        .then(data => {
          if (!Array.isArray(data)) throw new Error("Target response is not an array");
          renderTargets(data);
        })
        .catch(err => {
          console.error(err);
          const todayList = document.getElementById("todayList");
          const upcoming = document.getElementById("upcoming");
          const history = document.getElementById("history");
          const progressText = document.getElementById("progressText");

          if (todayList) todayList.innerHTML = "<p>Targets could not load.</p>";
          if (upcoming) upcoming.innerHTML = "";
          if (history) history.innerHTML = "";
          if (progressText) progressText.textContent = "";
        });
    }

    function renderTargets(data) {
      const todayDiv = document.getElementById("todayList");
      const upcomingDiv = document.getElementById("upcoming");
      const historyDiv = document.getElementById("history");
      const progressText = document.getElementById("progressText");

      if (!todayDiv || !upcomingDiv || !historyDiv) return;

      todayDiv.innerHTML = "";
      upcomingDiv.innerHTML = "";
      historyDiv.innerHTML = "";

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const upcomingGrouped = {};
      const historyGrouped = {};

      let todayTotal = 0;
      let todayDone = 0;

      data.forEach(row => {
        const rowDate = parseSheetDate(row.Date);
        if (!rowDate) return;

        const day = new Date(rowDate.getFullYear(), rowDate.getMonth(), rowDate.getDate());

        const tasks = [
          { task: row.T1, status: row.S1 },
          { task: row.T2, status: row.S2 },
          { task: row.T3, status: row.S3 }
        ];

        tasks.forEach(item => {
          if (!item.task) return;

          const isDone = item.status === "Done";

          const taskHtml = `
            <div style="${isDone ? 'text-decoration: line-through; opacity:0.6;' : ''}">
              ${escapeHtml(item.task)}
            </div>
          `;

          if (day.getTime() === today.getTime()) {
            todayTotal++;
            if (isDone) todayDone++;

            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = taskHtml;
            todayDiv.appendChild(div);
          } else if (day.getTime() > today.getTime()) {
            if (!upcomingGrouped[row.Date]) upcomingGrouped[row.Date] = [];
            upcomingGrouped[row.Date].push(taskHtml);
          } else {
            if (!historyGrouped[row.Date]) historyGrouped[row.Date] = [];
            historyGrouped[row.Date].push(taskHtml);
          }
        });
      });

      Object.keys(upcomingGrouped).sort().forEach(date => {
        const card = document.createElement("div");
        card.className = "date-card";

        const pretty = parseSheetDate(date);
        const formattedDate = pretty
          ? pretty.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })
          : escapeHtml(date);

        card.innerHTML = `<h3>${formattedDate}</h3>${upcomingGrouped[date].join("")}`;
        upcomingDiv.appendChild(card);
      });

      Object.keys(historyGrouped).sort().reverse().forEach(date => {
        const card = document.createElement("div");
        card.className = "date-card";

        const pretty = parseSheetDate(date);
        const formattedDate = pretty
          ? pretty.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })
          : escapeHtml(date);

        card.innerHTML = `<h3>${formattedDate}</h3>${historyGrouped[date].join("")}`;
        historyDiv.appendChild(card);
      });

      if (todayTotal === 0) {
        todayDiv.innerHTML = "<p>No targets for today.</p>";
      }

      if (progressText) {
        progressText.textContent = todayTotal
          ? `Today: ${todayDone}/${todayTotal} done`
          : "No target progress for today.";
      }
    }

    function scrollLeftFunc(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollBy({ left: -250, behavior: "smooth" });
    }

    function scrollRightFunc(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollBy({ left: 250, behavior: "smooth" });
    }
    
  
// ⏱ format
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

// 🔴 LIVE LISTENER (MAIN MAGIC)
db.ref("timer").on("value", (snapshot) => {
  const data = snapshot.val();

  if (!data) return;

  let start = data.startTime || null;
  let total = data.totalTime || 0;

  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    let currentSession = 0;

    if (start) {
      currentSession = Date.now() - start;
    }

    const finalTime = total + currentSession;

    // ⏱ current running timer
    document.getElementById("timerDisplay").innerText =
      formatTime(currentSession);

    // 📊 total today time (MAIN FIX)
    document.getElementById("todayTime").innerText =
      "Today: " + formatTime(finalTime);

  }, 200); // smooth fast update

  updateStatus(!!start);
});

// ▶ START
function startTimer() {
  db.ref("timer").once("value").then(snapshot => {
    const data = snapshot.val() || {};

    if (data.startTime) return; // already running

    db.ref("timer").set({
      startTime: Date.now(),
      totalTime: data.totalTime || 0, // ✅ correct
      status: "running"
    });
  });
}

// ⏹ STOP
function stopTimer() {
  db.ref("timer").once("value").then(snapshot => {
    const data = snapshot.val();

    if (!data || !data.startTime) return;

    const sessionTime = Date.now() - data.startTime;
    const newTotal = (data.totalTime || 0) + sessionTime;

    db.ref("timer").set({
      startTime: null,
      totalTime: newTotal,
      status: "stopped"
    });
  });
}

// 🔄 RESET
function resetTimer() {
  db.ref("timer").set({
    startTime: null,
    totalTime: 0,
    status: "reset"
  });
}

// 🟢 STATUS
function updateStatus(isRunning) {
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");

  if (isRunning) {
    dot.classList.add("studying");
    text.innerText = "Studying";
  } else {
    dot.classList.remove("studying");
    text.innerText = "Not Studying";
  }
}

    const texts = ["Tech Lover", "JEE Aspirant", "Bihari"];
let i = 0;
let j = 0;
let currentText = "";
let isDeleting = false;

function typeEffect() {
  currentText = texts[i];

  if (isDeleting) {
    j--;
  } else {
    j++;
  }

  document.getElementById("typing").innerHTML =
    currentText.substring(0, j) + "|";

  if (!isDeleting && j === currentText.length) {
    isDeleting = true;
    setTimeout(typeEffect, 1000); // pause at end
    return;
  }

  if (isDeleting && j === 0) {
    isDeleting = false;
    i = (i + 1) % texts.length;
  }

  setTimeout(typeEffect, isDeleting ? 50 : 100);
}

typeEffect();

    
  </script>
