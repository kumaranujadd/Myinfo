body{
margin:0;

 body {
  font-family: system-ui, -apple-system, "Segoe UI", "Segoe UI Emoji", "Noto Color Emoji", "Apple Color Emoji", sans-serif;
}

 
/* ===== LOADING SCREEN ===== */
#loader{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
transition:opacity .8s ease, visibility .8s;
}

.loader-ring{
width:70px;
height:70px;
border-radius:50%;
border:4px solid #1e293b;
border-top:4px solid #38bdf8;
animation:spin 1s linear infinite;
margin-bottom:20px;
}
@keyframes spin{
to{transform:rotate(360deg);}
}

.hide-loader{
opacity:0;
visibility:hidden;
}

/* ===== Neon Background ===== */
.neon{
position:fixed;
width:200px;
height:200px;
background:radial-gradient(circle,#38bdf8,transparent);
filter:blur(80px);
opacity:.25;
animation:float 12s infinite alternate;
z-index:-1;
}
.neon:nth-child(1){top:10%;left:10%;}
.neon:nth-child(2){bottom:10%;right:10%;animation-delay:3s;}
@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* ===== Navbar ===== */
nav{
position:fixed;
width:100%;
padding:15px;
background:#020617cc;
backdrop-filter:blur(8px);
text-align:center;
z-index:100;
}
nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}
nav a:hover{color:#38bdf8;}

section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:40px;
}

/* ===== Gradient Name ===== */
.gradient{
font-size:55px;
background:linear-gradient(90deg,#38bdf8,#a78bfa,#38bdf8);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:shine 4s linear infinite;
}
@keyframes shine{
0%{background-position:0%;}
100%{background-position:200%;}
}

#typing{font-size:22px;margin-top:10px;opacity:.85;}

/* Chill panel */
.glass{
background:rgba(2,6,23,0.6);
border:1px solid #1e293b;
backdrop-filter:blur(12px);
border-radius:14px;
padding:20px;
margin-top:20px;
box-shadow:0 0 20px #0ea5e9;
}

/* Cards */
.card{
background:#020617;
padding:20px;
margin:15px;
border-radius:14px;
border:1px solid #1e293b;
transition:.4s;
}

.card:hover{
transform:scale(1.06);
box-shadow:0 0 25px #38bdf8;
}

/* Button */
.btn{
  margin-top:15px;
  padding:10px 20px;
  border-radius:8px;
  border:1px solid #38bdf8;
  color:#020617;              /* 🔥 DARK TEXT */
  background:#38bdf8;         /* 🔥 BLUE BACKGROUND */
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:#0ea5e9;
  color:white;
  box-shadow:0 0 15px #38bdf8;
}

/* Floating Social */
.floating-social{
position:fixed;
right:20px;
bottom:20px;
display:flex;
flex-direction:column;
gap:12px;
}
.float-btn{
width:50px;height:50px;
border-radius:50%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
border:1px solid #38bdf8;
transition:.3s;
}
.float-btn svg{fill:white;width:24px;}
.float-btn:hover{
background:#38bdf8;
transform:scale(1.15);
box-shadow:0 0 20px #38bdf8;
}

/* Mouse Glow */
#cursorGlow{
position:fixed;
width:150px;height:150px;
border-radius:50%;
background:radial-gradient(circle,#38bdf8,transparent);
pointer-events:none;
opacity:.25;
transform:translate(-50%,-50%);
}

#upcoming,
#history {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 20px;
  scroll-behavior: smooth;
  width: 100%;
}

.date-card {
  min-width: 220px;
  max-width: 220px;
  background: #020617;
  border: 2px solid #1e293b;
  border-radius: 20px;
  padding: 15px;
  flex-shrink: 0;
}

.date-card h3 {
  margin-bottom: 10px;
  text-align: center;
}


 .scroll-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.scroll-btn {
  position: absolute;
  z-index: 10;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: #020617;
  color: white;
  font-size: 18px;
  cursor: pointer;
  border: 1px solid #38bdf8;
  transition: 0.3s;
}

.scroll-btn:hover {
  background: #38bdf8;
  transform: scale(1.1);
  box-shadow: 0 0 15px #38bdf8;
}

.scroll-btn.left {
  left: -10px;
}

.scroll-btn.right {
  right: -10px;
}

 #upcoming::-webkit-scrollbar,
#history::-webkit-scrollbar {
  display: none;
}

 .scroll-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}

.scroll-wrapper #upcoming,
.scroll-wrapper #history {
  width: 100%;
}


 .scroll-btn.left {
  left: 5px;
}

.scroll-btn.right {
  right: 5px;
}


 #upcoming,
#history {
  scroll-snap-type: x mandatory;
}

.date-card {
  scroll-snap-align: start;
}
</style>
</head>

<body>

Bhai JEE ne lanka laga diya hai 🙂‍↕️🙂‍↕️

 </section>

<h2>Today Target 🎯</h2>

<p id="progressText"></p>

 <div class="glass">
  <h2>Study Timer ⏱️</h2>

  <h1 id="timerDisplay">00:00:00</h1>

  <button onclick="startTimer()" class="btn">▶ Start</button>
  <button onclick="stopTimer()" class="btn">⏹ Stop</button>
  <button onclick="resetTimer()" class="btn">🔄 Reset</button>
</div>

<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("loader").classList.add("hide-loader");
  }, 1000);
});

fetch("https://opensheet.elk.sh/1A1In9joYUNj8kTljvEZ7DyZcGt7RsBsiMUcPi_LEbLA/Sheet1")
  .then(res => res.json())
  .then(data => {

    const todayDiv = document.getElementById("todayList");
    const upcomingDiv = document.getElementById("upcoming");
    const historyDiv = document.getElementById("history");

    todayDiv.innerHTML = "";
    upcomingDiv.innerHTML = "";
    historyDiv.innerHTML = "";

    const todayDate = new Date().toISOString().split("T")[0];

    const upcomingGrouped = {};
    const historyGrouped = {};

    data.forEach(row => {

      const tasks = [
        { task: row.T1, status: row.S1 },
        { task: row.T2, status: row.S2 },
        { task: row.T3, status: row.S3 }
      ];

      tasks.forEach(item => {
        if (!item.task) return;

        const isDone = item.status === "Done";

        // ✅ TODAY
        if (row.Date === todayDate) {

          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
            <span style="${isDone ? 'text-decoration: line-through; opacity:0.6;' : ''}">
              ${item.task}
            </span>
          `;

          todayDiv.appendChild(div);
        }

        // ✅ UPCOMING
        else if (row.Date > todayDate) {
          if (!upcomingGrouped[row.Date]) {
            upcomingGrouped[row.Date] = [];
          }
          upcomingGrouped[row.Date].push(item);
        }

        // ✅ PREVIOUS
        else if (row.Date < todayDate) {
          if (!historyGrouped[row.Date]) {
            historyGrouped[row.Date] = [];
          }
          historyGrouped[row.Date].push(item);
        }

      });

    });

    // 🔥 UPCOMING CARDS
    Object.keys(upcomingGrouped).sort().forEach(date => {

      const card = document.createElement("div");
      card.className = "date-card";

      const formattedDate = new Date(date).toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short"
      });

      let html = "";

      upcomingGrouped[date].forEach(item => {
        const isDone = item.status === "Done";

        html += `
          <div style="${isDone ? 'text-decoration: line-through; opacity:0.6;' : ''}">
            ${item.task}
          </div>
        `;
      });

      card.innerHTML = `<h3>${formattedDate}</h3>${html}`;
      upcomingDiv.appendChild(card);
    });

    // 🔥 PREVIOUS CARDS (REVERSE ORDER - LATEST FIRST)
    Object.keys(historyGrouped).sort().reverse().forEach(date => {

      const card = document.createElement("div");
      card.className = "date-card";

      const formattedDate = new Date(date).toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short"
      });

      let html = "";

      historyGrouped[date].forEach(item => {
        const isDone = item.status === "Done";

        html += `
          <div style="${isDone ? 'text-decoration: line-through; opacity:0.6;' : ''}">
            ${item.task}
          </div>
        `;
      });

      card.innerHTML = `<h3>${formattedDate}</h3>${html}`;
      historyDiv.appendChild(card);
    });

  });

 function scrollLeftFunc(id) {
  document.getElementById(id).scrollBy({
    left: -250,
    behavior: "smooth"
  });
}

function scrollRightFunc(id) {
  document.getElementById(id).scrollBy({
    left: 250,
    behavior: "smooth"
  });
}

 const API_URL = "https://script.google.com/macros/s/AKfycbwfyW14gXtjvRHP4J2kQfLZ7WlMxABHEVEkjPL9whxmYZISUmmmdYHM2Ckj0VSGkZ_7/exec";

let timerInterval = null;

// format time
function formatTime(ms) {
  let totalSeconds = Math.floor(ms / 1000);
  let h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
  let m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
  let s = String(totalSeconds % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}


// START

 function startTimer() {
  if (startTimeGlobal) return;
  
  const now = new Date();

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      date: now.toISOString().split("T")[0],
      start: now.toTimeString().split(" ")[0]
    })
  });

  startTimeGlobal = now;
  runTimer();
}

// STOP
function stopTimer() {
  const now = new Date();

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      date: now.toISOString().split("T")[0],
      end: now.toTimeString().split(" ")[0]
    })
  });

  clearInterval(timerInterval);

  // 🔥 ADD THIS LINE (MOST IMPORTANT)
  startTimeGlobal = null;
}
// RESET
function resetTimer() {
  clearInterval(timerInterval);
  startTimeGlobal = null;
  document.getElementById("timerDisplay").innerText = "00:00:00";
}

// AUTO LOAD

 let startTimeGlobal = null;

function runTimer() {
  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    if (!startTimeGlobal) return;

    const now = new Date();
    const diff = now - startTimeGlobal;

    document.getElementById("timerDisplay").innerText = formatTime(diff);
  }, 1000);
}

function loadTimerFromServer() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
     console.log(data);

      if (data.length === 0) return;

    const running = data.reverse().find(row => row.start && (row.end === "" || !row.end));
if (running) {
const start = new Date((running.date || running.Date) + "T" + (running.start || running.StartTime));
  // 🔥 only start if not already running

    startTimeGlobal = start;
    runTimer();
 
} else {
  clearInterval(timerInterval);
  startTimeGlobal = null;

  // 🔥 ADD THIS (display reset)
  document.getElementById("timerDisplay").innerText = "00:00:00";
}
    });
}

// FINAL LOAD
window.addEventListener("load", () => {
  loadTimerFromServer();

  // 🔥 auto sync every 3 sec
  setInterval(() => {
    loadTimerFromServer();
  }, 3000);
});
</script>
</body>
</html>
