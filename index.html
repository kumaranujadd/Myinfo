<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuj | Dev Portfolio</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#020617;
color:white;
overflow-x:hidden;
scroll-behavior:smooth;
}

/* LOADER */
#loader{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}
.loader-ring{
width:70px;
height:70px;
border-radius:50%;
border:4px solid #1e293b;
border-top:4px solid #38bdf8;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* NAV */
nav{
position:fixed;
width:100%;
padding:15px;
background:#020617cc;
text-align:center;
z-index:100;
}
nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

/* SECTION */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:40px;
}

/* CARDS */
.card{
background:#020617;
padding:15px;
margin:10px;
border-radius:12px;
border:1px solid #1e293b;
}

/* DATE CARD */
.date-card{
min-width:220px;
background:#020617;
border:2px solid #1e293b;
border-radius:15px;
padding:15px;
flex-shrink:0;
}

/* SCROLL FIX */
#upcoming, #history{
display:flex;
overflow-x:auto;
gap:20px;
padding:20px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
}
#history{
justify-content:flex-start;
}
#upcoming::-webkit-scrollbar,
#history::-webkit-scrollbar{
display:none;
}

/* BUTTON */
.scroll-btn{
background:#020617;
color:white;
border:1px solid #38bdf8;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
}
.scroll-btn:hover{
background:#38bdf8;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="loader-ring"></div>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Daily Target</a>
</nav>

<section>

<h2>Today Target 🎯</h2>
<div id="todayList"></div>

<h2>Upcoming Targets ⏳</h2>

<div>
<button class="scroll-btn" onclick="scrollLeft('upcoming')">⬅</button>
<button class="scroll-btn" onclick="scrollRight('upcoming')">➡</button>
</div>

<div id="upcoming"></div>

<h2>Previous Targets 📅</h2>

<div>
<button class="scroll-btn" onclick="scrollLeft('history')">⬅</button>
<button class="scroll-btn" onclick="scrollRight('history')">➡</button>
</div>

<div id="history"></div>

</section>

<script>
// loader
window.addEventListener("load", () => {
setTimeout(()=>{
document.getElementById("loader").style.display="none";
},800);
});

// scroll buttons
function scrollLeft(id){
document.getElementById(id).scrollBy({left:-300,behavior:'smooth'});
}
function scrollRight(id){
document.getElementById(id).scrollBy({left:300,behavior:'smooth'});
}

// fetch data
fetch("https://opensheet.elk.sh/1A1In9joYUNj8kTljvEZ7DyZcGt7RsBsiMUcPi_LEbLA/Sheet1")
.then(res=>res.json())
.then(data=>{

const todayDiv=document.getElementById("todayList");
const upcomingDiv=document.getElementById("upcoming");
const historyDiv=document.getElementById("history");

todayDiv.innerHTML="";
upcomingDiv.innerHTML="";
historyDiv.innerHTML="";

const todayDate=new Date().toISOString().split("T")[0];

const upcomingGrouped={};
const historyGrouped={};

data.forEach(row=>{

const tasks=[
{task:row.T1,status:row.S1},
{task:row.T2,status:row.S2},
{task:row.T3,status:row.S3} // FIXED
];

tasks.forEach(item=>{
if(!item.task) return;

const isDone=(item.status||"").trim()==="Done";

// TODAY
if(row.Date===todayDate){
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<span style="${isDone?'text-decoration:line-through;opacity:0.6;':''}">
${item.task}
</span>`;
todayDiv.appendChild(div);
}

// UPCOMING
else if(row.Date>todayDate){
if(!upcomingGrouped[row.Date]) upcomingGrouped[row.Date]=[];
upcomingGrouped[row.Date].push(item);
}

// PREVIOUS
else{
if(!historyGrouped[row.Date]) historyGrouped[row.Date]=[];
historyGrouped[row.Date].push(item);
}

});

});

// UPCOMING
Object.keys(upcomingGrouped).sort().forEach(date=>{
const card=document.createElement("div");
card.className="date-card";

let html="";
upcomingGrouped[date].forEach(item=>{
const isDone=(item.status||"").trim()==="Done";
html+=`<div style="${isDone?'text-decoration:line-through;opacity:0.6;':''}">
${item.task}</div>`;
});

card.innerHTML=`<h3>${new Date(date).toDateString().slice(4,10)}</h3>${html}`;
upcomingDiv.appendChild(card);
});

// PREVIOUS
Object.keys(historyGrouped).sort().reverse().forEach(date=>{
const card=document.createElement("div");
card.className="date-card";

let html="";
historyGrouped[date].forEach(item=>{
const isDone=(item.status||"").trim()==="Done";
html+=`<div style="${isDone?'text-decoration:line-through;opacity:0.6;':''}">
${item.task}</div>`;
});

card.innerHTML=`<h3>${new Date(date).toDateString().slice(4,10)}</h3>${html}`;
historyDiv.appendChild(card);
});

});
</script>

</body>
</html>
